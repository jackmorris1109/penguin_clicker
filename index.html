<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Penguin Clicker V0.1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
    <h1>Penguin Clicker</h1>
        <h3 id="desc">Click on the penguin to earn more penguins!</h3>
        <p id="counter">Penguins: 0</p>
    <button id="penguinBtn">
      <img src="images/penguin.png">
    </button>
    </div>
    <div id="shop">
        <h2>Shop</h2>
    <div class="button-group">
        <button id="multiplierBtn">Super Penguin Upgrade (50 Penguins)</button>
        <button id="megaBtn">Mega Penguin Upgrade (600 Penguins)</button>
        <button>Sell Me</button>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
